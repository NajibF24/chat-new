stages:
  - build
  - deploy

variables:
  IMAGE: harbor.gyssteel.com/portalai/client

build:
  stage: build
  tags:
    - CI-Shell
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"  # Hanya jalan di branch development
  script:
    - >
      docker build
      -f client/Dockerfile
      --build-arg VITE_APP_NAME="$VITE_APP_NAME"
      --build-arg VITE_API_BASE_URL="$VITE_API_BASE_URL_DEV"
      --build-arg VITE_ENV="dev"
      --build-arg VITE_BASE_URL="$VITE_BASE_URL"
      -t $IMAGE:$CI_COMMIT_BRANCH-$CI_COMMIT_SHORT_SHA
      .
    - docker push $IMAGE:$CI_COMMIT_BRANCH-$CI_COMMIT_SHORT_SHA
    - docker rmi $IMAGE:$CI_COMMIT_BRANCH-$CI_COMMIT_SHORT_SHA
